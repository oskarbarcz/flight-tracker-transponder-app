<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>ADS-B track</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <style>
        html, body { margin: 0; height: 100%; font: 13px system-ui, sans-serif; }
        #map { height: 100%; }
        #bar { position: absolute; z-index: 1000; top: 10px; left: 60px;
            background: #fff; padding: 8px 10px; border-radius: 6px;
            box-shadow: 0 1px 6px rgba(0,0,0,.3); }
        #bar input { width: 9em; }
        #note { color: #666; }
    </style>
</head>
<body>
<div id="bar">
    <input id="callsign" value="DLH1234">
    <button id="load">Load</button>
    <span id="note"></span>
</div>
<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  // Relative on purpose. `npm run preview` serves this page and forwards /api
  // to the ADS-B service, so the request is same-origin and the browser has no
  // CORS question to ask — the service allows https://flights.barcz.me and
  // nothing else, so any absolute URL here is refused by the browser.
  //
  // The token belongs to the proxy, not to this page: bin/preview.mjs reads it
  // from the environment or .env and attaches it on the way out.
  const BASE = '/api/v1/position';

  const map = L.map('map').setView([52.23, 21.0], 6);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19, attribution: '&copy; OpenStreetMap'
  }).addTo(map);

  const layer = L.layerGroup().addTo(map);
  const note = document.getElementById('note');

  async function load() {
    const callsign = document.getElementById('callsign').value.trim().toUpperCase();
    layer.clearLayers();
    note.textContent = 'loading…';

    let reports;
    try {
      const response = await fetch(`${BASE}/${encodeURIComponent(callsign)}`);
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      reports = await response.json();
    } catch (error) {
      note.textContent = `failed: ${error.message}`;
      return;
    }

    if (!Array.isArray(reports) || reports.length === 0) {
      note.textContent = 'no positions for that callsign';
      return;
    }

    reports.sort((a, b) => new Date(a.date) - new Date(b.date));
    const points = reports.map(r => [r.latitude, r.longitude]);

    L.polyline(points, { color: '#6875F5', weight: 3 }).addTo(layer);

    reports.forEach((r, i) => {
      const last = i === reports.length - 1;
      L.circleMarker([r.latitude, r.longitude], {
        radius: last ? 6 : 3,
        color: last ? '#d33' : '#6875F5',
        fillOpacity: 1
      }).addTo(layer).bindPopup(
        `<b>${r.callsign}</b><br>${new Date(r.date).toISOString()}<br>` +
        `${r.latitude.toFixed(5)}, ${r.longitude.toFixed(5)}<br>` +
        `alt ${r.altitude} ft · gs ${r.groundSpeed} kt · trk ${r.track}°<br>` +
        `vs ${r.verticalRate} fpm · squawk ${r.squawk}` +
        (r.isOnGround ? '<br><i>on ground</i>' : '')
      );
    });

    map.fitBounds(L.latLngBounds(points), { padding: [40, 40] });
    note.textContent = `${reports.length} positions`;
  }

  document.getElementById('load').addEventListener('click', load);
  load();
</script>
</body>
</html>
