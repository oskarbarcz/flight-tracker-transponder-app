name: 'release'

on:
  push:
    branches: ['main']

permissions:
  contents: write

jobs:
  tag:
    runs-on: 'ubuntu-24.04'
    steps:
      - name: 'Clone repository'
        uses: 'actions/checkout@v6'
      - name: 'Release and push git tag'
        run: "git tag $(jq -r '.version' package.json) && git push --tags"
      - name: 'Create a GitHub release'
        run: "gh release create $(jq -r '.version' package.json) --generate-notes"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  executable:
    needs: tag
    runs-on: 'windows-2025'
    steps:
      - name: 'Clone repository'
        uses: 'actions/checkout@v6'
      - name: 'Set up Node'
        uses: 'actions/setup-node@v4'
        with:
          node-version: '24'
          cache: 'npm'
      - name: 'Set up Bun'
        uses: 'oven-sh/setup-bun@v2'
        with:
          bun-version: 'latest'
      - name: 'Install dependencies'
        run: 'npm ci'
      - name: 'Compile the Windows executable'
        run: 'npm run build:exe'
      - name: 'Smoke test the executable'
        shell: 'pwsh'
        run: |
          $output = & ./dist/flight-tracker-transponder.exe 2>&1
          if ($LASTEXITCODE -eq 0) {
            throw "the executable should refuse to start with no configuration"
          }
          if ($output -notmatch 'API_BASE_URL') {
            throw "expected the missing-configuration message, got: $output"
          }
          Write-Host "the executable refuses to start and names the missing configuration"
      - name: 'Attach the executable to the GitHub release'
        shell: 'bash'
        run: "gh release upload $(jq -r '.version' package.json) dist/flight-tracker-transponder.exe"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
