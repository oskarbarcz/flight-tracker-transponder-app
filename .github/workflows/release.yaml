name: 'release'

on:
  push:
    branches: ['main']

permissions:
  contents: write

jobs:
  tag:
    runs-on: 'ubuntu-24.04'
    steps:
      - name: 'Clone repository'
        uses: 'actions/checkout@v6'
      - name: 'Release and push git tag'
        run: "git tag $(jq -r '.version' package.json) && git push --tags"
      - name: 'Create a GitHub release'
        run: "gh release create $(jq -r '.version' package.json) --generate-notes"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  executable:
    needs: tag
    runs-on: 'windows-2025'
    steps:
      - name: 'Clone repository'
        uses: 'actions/checkout@v6'
      - name: 'Set up Node'
        uses: 'actions/setup-node@v4'
        with:
          node-version: '24'
          cache: 'npm'
      - name: 'Set up Bun'
        uses: 'oven-sh/setup-bun@v2'
        with:
          bun-version: 'latest'
      - name: 'Install dependencies'
        run: 'npm ci'
      - name: 'Compile the Windows executable'
        run: 'npm run build:exe'
        env:
          ADSB_CLIENT_TOKEN: ${{ secrets.ADSB_CLIENT_TOKEN }}
      - name: 'Smoke test the executable'
        shell: 'pwsh'
        run: |
          $output = & ./dist/flight-tracker-transponder.exe --version 2>&1
          $code = $LASTEXITCODE
          $expected = (Get-Content package.json | ConvertFrom-Json).version

          if ($code -ne 0) {
            throw "--version exited with $code, output: $output"
          }
          if ($output -notmatch [regex]::Escape($expected)) {
            throw "expected version $expected, got: $output"
          }

          Write-Host "smoke test passed: the executable reports $output"
          exit 0
      - name: 'Attach the executable to the GitHub release'
        shell: 'bash'
        run: "gh release upload $(jq -r '.version' package.json) dist/flight-tracker-transponder.exe"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
