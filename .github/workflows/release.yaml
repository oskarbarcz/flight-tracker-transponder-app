name: 'release'

on:
  push:
    branches: ['main']

permissions:
  contents: write

jobs:
  tag:
    runs-on: 'ubuntu-24.04'
    steps:
      - name: 'Clone repository'
        uses: 'actions/checkout@v7'
      - name: 'Release and push git tag'
        run: "git tag $(jq -r '.version' package.json) && git push --tags"
      - name: 'Create a GitHub release'
        run: "gh release create $(jq -r '.version' package.json) --generate-notes"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  executable:
    needs: tag
    runs-on: 'windows-2025'
    steps:
      - name: 'Clone repository'
        uses: 'actions/checkout@v7'
      - name: 'Set up Node'
        uses: 'actions/setup-node@v7'
        with:
          node-version: '26'
          cache: 'npm'
      - name: 'Set up Bun'
        uses: 'oven-sh/setup-bun@v2'
        with:
          bun-version: 'latest'
      - name: 'Install dependencies'
        run: 'npm ci'
      - name: 'Compile the Windows executable'
        run: 'npm run build:exe'
        env:
          ADSB_CLIENT_TOKEN: ${{ secrets.ADSB_CLIENT_TOKEN }}
      - name: 'Smoke test the executable'
        shell: 'pwsh'
        run: './scripts/smoke-test.ps1'
      - name: 'Check the executable carries the icon and properties'
        shell: 'pwsh'
        run: './scripts/check-icon.ps1'
      - name: 'Check the dashboard renders from the executable'
        shell: 'pwsh'
        run: './scripts/check-frame.ps1'
      - name: 'Check the tray icon reaches the notification area'
        shell: 'pwsh'
        run: './scripts/check-tray.ps1'
      - name: 'Attach the executable to the GitHub release'
        shell: 'bash'
        run: "gh release upload $(jq -r '.version' package.json) dist/mypreflight-transponder.exe"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
