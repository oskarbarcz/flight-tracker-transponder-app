name: 'integrity'

on:
  pull_request:
    paths: ['**', '!**.md']

jobs:
  files:
    runs-on: 'ubuntu-24.04'
    steps:
      - name: 'Checkout repository'
        uses: 'actions/checkout@v6'
        with:
          fetch-depth: 0
      - name: 'Check for CRLF line endings'
        uses: 'gi-org-pl/check-crlf-action@v1'
      - name: 'Check for file permission changes'
        uses: 'gi-org-pl/check-file-permissions-action@v1'
      - name: 'Check app version is unique'
        uses: 'gi-org-pl/check-version-action@v1'
        with:
          version: "$(jq -r '.version' package.json)"
  code:
    runs-on: 'ubuntu-24.04'
    steps:
      - name: 'Checkout repository'
        uses: 'actions/checkout@v6'
      - name: 'Set up Node'
        uses: 'actions/setup-node@v4'
        with:
          node-version: '24'
          cache: 'npm'
      - name: 'Install dependencies'
        run: 'npm ci'
      - name: 'Check code with linter and formatter'
        run: 'npm run lint:ci'
      - name: 'Run type check'
        run: 'npm run typecheck'
      - name: 'Run unit tests'
        run: 'npm test'
  executable:
    runs-on: 'windows-2025'
    steps:
      - name: 'Checkout repository'
        uses: 'actions/checkout@v6'
      - name: 'Set up Node'
        uses: 'actions/setup-node@v4'
        with:
          node-version: '24'
          cache: 'npm'
      - name: 'Set up Bun'
        uses: 'oven-sh/setup-bun@v2'
        with:
          bun-version: 'latest'
      - name: 'Install dependencies'
        run: 'npm ci'
      - name: 'Compile the Windows executable'
        run: 'npm run build:exe'
      - name: 'Smoke test the executable'
        shell: 'pwsh'
        run: |
          $output = & ./dist/flight-tracker-transponder.exe 2>&1
          $code = $LASTEXITCODE

          if ($code -eq 0) {
            throw "the executable should refuse to start with no configuration"
          }
          if ($output -notmatch 'API_BASE_URL') {
            throw "expected the missing-configuration message, got: $output"
          }

          Write-Host "the executable refuses to start and names the missing configuration"
          exit 0
