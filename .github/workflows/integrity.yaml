name: 'integrity'

on:
  pull_request:
    paths: ['**', '!**.md']

jobs:
  files:
    runs-on: 'ubuntu-24.04'
    steps:
      - name: 'Checkout repository'
        uses: 'actions/checkout@v7'
        with:
          fetch-depth: 0
      - name: 'Check for CRLF line endings'
        uses: 'gi-org-pl/check-crlf-action@v1'
      - name: 'Check for file permission changes'
        uses: 'gi-org-pl/check-file-permissions-action@v1'
      - name: 'Check app version is unique'
        uses: 'gi-org-pl/check-version-action@v1'
        with:
          version: "$(jq -r '.version' package.json)"
  code:
    runs-on: 'ubuntu-24.04'
    steps:
      - name: 'Checkout repository'
        uses: 'actions/checkout@v7'
      - name: 'Set up Node'
        uses: 'actions/setup-node@v7'
        with:
          node-version: '26'
          cache: 'npm'
      - name: 'Install dependencies'
        run: 'npm ci'
      - name: 'Check code with linter and formatter'
        run: 'npm run lint:ci'
      - name: 'Run type check'
        run: 'npm run typecheck'
      - name: 'Run unit tests'
        run: 'npm test'
  executable:
    runs-on: 'windows-2025'
    steps:
      - name: 'Checkout repository'
        uses: 'actions/checkout@v7'
      - name: 'Set up Node'
        uses: 'actions/setup-node@v7'
        with:
          node-version: '26'
          cache: 'npm'
      - name: 'Set up Bun'
        uses: 'oven-sh/setup-bun@v2'
        with:
          bun-version: 'latest'
      - name: 'Install dependencies'
        run: 'npm ci'
      - name: 'Compile the Windows executable'
        run: 'npm run build:exe'
      - name: 'Smoke test the executable'
        shell: 'pwsh'
        run: './scripts/smoke-test.ps1'
      - name: 'Check the executable carries the icon and properties'
        shell: 'pwsh'
        run: './scripts/check-icon.ps1'
      - name: 'Check the dashboard renders from the executable'
        shell: 'pwsh'
        run: './scripts/check-frame.ps1'
      - name: 'Check the tray icon reaches the notification area'
        shell: 'pwsh'
        run: './scripts/check-tray.ps1'
